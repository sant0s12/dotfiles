# ###############################
#				                #
#  Basic config			        #
#				                #
# ###############################

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mod = SUPER

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = eDP-1,preferred,auto,1
monitor = ,preferred,auto,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = ch-qwerty
    kb_variant =
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10

    border_size = 1
    resize_on_border = 1

    col.active_border = rgba(f1f1f1ff)
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

misc {
    disable_hyprland_logo = true
	enable_anr_dialog = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5

	shadow {
		enabled = yes
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	}

    active_opacity = 0.9
    inactive_opacity = 0.9

    blur {
        size = 8
        passes = 3
        brightness = 1.0
        vibrancy = 0.2
    }
}

xwayland {
  force_zero_scaling = true
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = smooth, 0.16, 1, 0.3, 1

    animation = windows, 0, 1, default, popin
    animation = windowsOut, 0, 1, default
    animation = windowsMove, 1, 1, default
    animation = border, 1, 1, default
    animation = workspaces, 1, 1, default

    # Disable fade
    animation = fade, 0

    # Disable layer animations
    animation = layers, 0


    animation = layersIn, 1, 0.5, default
    animation = layersOut, 1, 0.5, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
    force_split = 2
}

# gesture = 4, horizontal, workspace
gesture = 4, left, dispatcher, sendshortcut, shift, g, activewindow


# Set cursor
exec-once = uwsm app -- hyprctl setcursor capitaine-cursors 24

# ###############################
#				                #
#  Workspaces			        #
#				                #
# ###############################

workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1

# Switch workspaces with mainMod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10


# ###############################
#				                #
#  Window rules			        #
#				                #
# ###############################

# Move to workspaces
windowrule = workspace 8, match:class thunderbird
windowrule = workspace 9, match:class ferdium
windowrule = workspace 9, match:class signal
windowrule = workspace 10, match:class com.github.th_ch.youtube_music

# Tile
windowrule = tile on, match:class Spotify

# Float
windowrule = float on, match:class org.kde.polkit-kde-authentication-agent-1
windowrule = float on, match:class blueman-manager
windowrule = float on, match:class pavucontrol
windowrule = float on, match:class nm-connection-editor
windowrule = float on, match:class wdisplays
windowrule = float on, match:class Matplotlib
windowrule = float on, match:class anki.desktop, match:title ^(Preview)$

# Nextcloud
windowrule = float on, match:class com.nextcloud.desktopclient.nextcloud
windowrule = size 30% 30%, match:class com.nextcloud.desktopclient.nextcloud
windowrule = move 100%-w-10 40, match:class com.nextcloud.desktopclient.nextcloud
windowrule = border_size = 0, match:class com.nextcloud.desktopclient.nextcloud

# Idle inhibit
windowrule = idle_inhibit fullscreen, match:class .*

# Opacity
windowrule = opaque on, match:class LibreWolf
windowrule = opaque on, match:class firefox
windowrule = opaque on, match:class kitty
windowrule = opaque on, match:class org.pwmt.zathura
windowrule = opaque on, match:class org.inkscape.Inkscape
windowrule = opaque on, match:title ^(Android Emulator -)
windowrule = opaque on, match:class Gimp
windowrule = opaque on, match:class virt-manager
windowrule = opaque on, match:class org.kde.kdenlive
windowrule = opaque on, match:class eog
windowrule = opaque on, match:class remote-viewer
windowrule = opaque on, match:class evince
windowrule = opaque on, match:class Zotero

# Picture-in-Picture
windowrule = float on, match:class firefox, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:class firefox, match:title ^(Picture-in-Picture)$

# Sharing Indicator
windowrule = float on,match:class ^(LibreWolf)$,match:title ^(LibreWolf — Sharing Indicator)$
windowrule = no_focus on,match:class ^(LibreWolf)$,match:title ^(LibreWolf — Sharing Indicator)$
windowrule = border_size = 0,match:class ^(LibreWolf)$,match:title ^(LibreWolf — Sharing Indicator)$
windowrule = move 49% 30,match:class ^(LibreWolf)$,match:title ^(LibreWolf — Sharing Indicator)$

# Do not blur floating xwayland (menus)
windowrule = no_blur on, match:xwayland 1, match:float 1
windowrule = opaque on, match:xwayland 1, match:float 1

# Smart gaps (no gaps when there is only one window)
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]

# Dragon
windowrule = move cursor -50% -50%, match:class dragon-drop
windowrule = size 5% 1%, match:class dragon-drop

# Slurp disable animation
layerrule = no_anim on, match:namespace selection

# Blur bar
layerrule = blur on, match:namespace waybar

# Blur rofi
layerrule = blur on, match:namespace rofi

# Blur dunst
layerrule = blur on, match:namespace notifications

# ###############################
#				                #
#  Shortcuts			        #
#				                #
# ###############################

# Use pactl to adjust volume in PulseAudio.
binde = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +10 --max-volume 150
binde = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -10 --max-volume 150
bind = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Media keys bindings
bind = ,XF86AudioPlay, exec, playerctl play-pause
bind = ,XF86AudioPause, exec, playerctl -a pause
bind = ,XF86AudioNext, exec, playerctl next
bind = ,XF86AudioPrev, exec, playerctl previous

bind = $mod, left, exec, playerctl previous
bind = $mod, right, exec, playerctl next
bind = $mod, down, exec, playerctl -a pause
bind = $mod, up, exec, playerctl play-pause

# Display key for lxrandr
bind = ,XF86Display, exec, pkill wdisplays || wdisplays

# Use xbacklight to change backlight
binde = ,XF86MonBrightnessUp, exec, xbacklight -set $(expr $(xbacklight -get) \* 3 \/ 2 + 1) -fps 60
binde = ,XF86MonBrightnessDown, exec, xbacklight -set $(expr $(xbacklight -get) \* 2 \/ 3) -fps 60

# start a terminal
bind = $mod, return, exec, ${TERMINAL}

# kill focused window
bind = $mod, q, killactive

# start dmenu (a program launcher)
bind = $mod, d, exec, rofi -show combi -modi combi -combi-modes web:rofi-web-search,drun -theme spotlight-dark -combi-display-format "{text}"

# change focus
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# move focused window
bind = $mod SHIFT, h, movewindoworgroup, l
bind = $mod SHIFT, l, movewindoworgroup, r
bind = $mod SHIFT, k, movewindoworgroup, u
bind = $mod SHIFT, j, movewindoworgroup, d

bind = $mod, x, togglesplit
bind = $mod SHIFT, z, togglegroup
bind = $mod, z, changegroupactive

# enter fullscreen mode for the focused container
bind = $mod, f, fullscreen

# toggle tiling / floating
bind = $mod, space, togglefloating

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Exit
bind = $mod SHIFT, e, exit

# Web browser
bind = $mod, w, exec, ${BROWSER}
bind = $mod CTRL, w, exec, ${BROWSER} --private-window

# Spotify
bind = $mod, m, exec, launch-focus-hyprland -x youtube-music -c "com.github.th_ch.youtube_music"

# Signal
bind = $mod, comma, exec, launch-focus-hyprland -x signal-desktop -c signal

# Ferdium
bind = $mod, period, exec, launch-focus-hyprland -x ferdium -c ferdium

# File explorer
bind = $mod, e, exec, ${EXPLORER}

# Thunderbird
bind = $mod, n, exec, launch-focus-hyprland -x thunderbird

# Suspend and lock
bind = $mod SHIFT, p, exec, systemctl suspend-then-hibernate
bind = $mod, p, exec, lockscreen

# Focus urgent
bind = $mod, u, focusurgentorlast

# Dunst close notification
bind = CTRL, space, exec, dunstctl close

# Screenshot
bind = $mod, s, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod + SHIFT, s, exec, GRIM_DEFAULT_DIR=~/Pictures/screenshots grim -g "$(slurp)"

# Toggle opauqe
bind = $mod + SHIFT, o, exec, hyprctl setprop active opaque toggle

# Move worskapce to monitors
bind = $mod CTRL, 0, movecurrentworkspacetomonitor, 0
bind = $mod CTRL, 9, movecurrentworkspacetomonitor, 1


# ###############################
#				                #
#  Autostart			        #
#				                #
# ###############################

# gnome-keyring (for ssh keys)
exec-once = uwsm app -- gnome-keyring-daemon --start

# libinput-gestures
# exec-once = uwsm app -- libinput-gestures

# Waybar
exec-once = uwsm app -- launch-waybar

# Wallpaper
exec-once = uwsm app -- setwallpaper

# NetorkManager applet
exec-once = uwsm app -- nm-applet --indicator

# blueman applet
exec-once = uwsm app -- blueman-applet

# udiskie
exec-once = uwsm app -- udiskie -s

# gammastep
exec-once = uwsm app -- gammastep-indicator

# swayosd
exec = uwsm app -- swayosd-server

# hypridle
exec-once = uwsm app -- hypridle
