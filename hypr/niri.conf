// Niri configuration translated from Hyprland
// Based on the default Niri config with Hyprland settings preserved

// ============================================
// Input Configuration
// ============================================
input {
    keyboard {
        xkb {
            // Hyprland: kb_layout = ch-qwerty, kb_options = caps:swapescape
            layout "ch-qwerty"
            options "caps:swapescape"
        }
    }

    touchpad {
        tap
        natural-scroll
        // accel-speed 0.2
    }

    // Focus windows and outputs automatically when moving the mouse into them.
    // focus-follows-mouse
}

// ============================================
// Output Configuration (Monitors)
// ============================================
// Hyprland: monitor = eDP-1,preferred,auto,1 and monitor = ,preferred,auto,1
output "eDP-1" {
    // Mode is automatically picked if omitted.
    // Position is set automatically.
}

output "" {
    // Mode is automatically picked if omitted.
    // Position is set automatically.
}

// ============================================
// Layout Configuration
// ============================================
layout {
    // Hyprland: gaps_in = 5, gaps_out = 10
    gaps 16

    preset-column-widths {
        proportion 0.33333
        proportion 0.5
        proportion 0.66667
    }

    default-column-width { proportion 0.5; }

    focus-ring {
        // Hyprland: col.active_border = rgba(f1f1f1ff)
        active-color "rgba(f1f1f1ff)"
        // Hyprland: col.inactive_border = rgba(595959aa)
        inactive-color "rgba(595959aa)"
        width 4
    }

    border {
        width 4
        // Hyprland: col.active_border, col.inactive_border
        active-color "rgba(f1f1f1ff)"
        inactive-color "rgba(595959aa)"
    }

    shadow {
        on
        softness 40
        spread 5
        offset x=0 y=5
        draw-behind-window true
        color "#1a1a1aee"
    }

    tab-indicator {
        active-color "red"
        inactive-color "gray"
        urgent-color "blue"
    }

    // Hyprland: rounding = 5
    geometry-corner-radius 5
    clip-to-geometry true

    tiled-state true
}

// ============================================
// Background Effects
// ============================================
blur {
    // Hyprland: blur { size = 8, passes = 3, brightness = 1.0, vibrancy = 0.2 }
    size 8
    passes 3
    brightness 1.0
    vibrancy 0.2
}

// ============================================
// Window Rules
// ============================================

// Move to workspaces
window-rule {
    // Hyprland: windowrule = workspace 8, match:class thunderbird
    match class="thunderbird"
    open-on-workspace "8"
}
window-rule {
    // Hyprland: windowrule = workspace 9, match:class ferdium
    match class="ferdium"
    open-on-workspace "9"
}
window-rule {
    // Hyprland: windowrule = workspace 9, match:class signal
    match class="signal"
    open-on-workspace "9"
}
window-rule {
    // Hyprland: windowrule = workspace 10, match:class com.github.th_ch.youtube_music
    match class="com.github.th-ch.youtube-music"
    open-on-workspace "10"
}

// Tile Spotify
window-rule {
    // Hyprland: windowrule = tile on, match:class Spotify
    match class="Spotify"
    tiled-state true
}

// Float rules
window-rule {
    // Hyprland: windowrule = float on, match:class org.kde.polkit-kde-authentication-agent-1
    match class="org.kde.polkit-kde-authentication-agent-1"
    open-floating true
}
window-rule {
    // Hyprland: windowrule = float on, match:class blueman-manager
    match class="blueman-manager"
    open-floating true
}
window-rule {
    // Hyprland: windowrule = float on, match:class pavucontrol
    match class="pavucontrol"
    open-floating true
}
window-rule {
    // Hyprland: windowrule = float on, match:class nm-connection-editor
    match class="nm-connection-editor"
    open-floating true
}
window-rule {
    // Hyprland: windowrule = float on, match:class wdisplays
    match class="wdisplays"
    open-floating true
}
window-rule {
    // Hyprland: windowrule = float on, match:class Matplotlib
    match class="matplotlib"
    open-floating true
}
window-rule {
    // Hyprland: windowrule = float on, match:class anki.desktop, match:title ^(Preview)$
    match class="anki.desktop" title="^(Preview)$"
    open-floating true
}

// Nextcloud
window-rule {
    // Hyprland: windowrule = float on, match:class com.nextcloud.desktopclient.nextcloud
    match class="com.nextcloud.desktopclient.nextcloud"
    open-floating true
}
window-rule {
    // Hyprland: windowrule = size 30% 30%, match:class com.nextcloud.desktopclient.nextcloud
    match class="com.nextcloud.desktopclient.nextcloud"
    default-column-width { proportion 0.3; }
    default-window-height { proportion 0.3; }
}
window-rule {
    // Hyprland: windowrule = move 100%-w-10 40, match:class com.nextcloud.desktopclient.nextcloud
    match class="com.nextcloud.desktopclient.nextcloud"
    default-floating-position x=100% y=-10 w=-40 h=40
}

// Idle inhibit
window-rule {
    // Hyprland: windowrule = idle_inhibit fullscreen, match:class .*
    match class=".*"
    idle-inhibit "fullscreen"
}

// Opacity (Hyprland: active_opacity = 0.9, inactive_opacity = 0.9)
window-rule {
    // Hyprland: windowrule = opaque on, match:class LibreWolf
    match class="LibreWolf"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class firefox
    match class="firefox"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class kitty
    match class="kitty"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class org.pwmt.zathura
    match class="org.pwmt.zathura"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class org.inkscape.Inkscape
    match class="org.inkscape.Inkscape"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:title ^(Android Emulator -)
    match title="^(Android Emulator -)"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class Gimp
    match class="Gimp"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class virt-manager
    match class="virt-manager"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class org.kde.kdenlive
    match class="org.kde.kdenlive"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class eog
    match class="eog"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class remote-viewer
    match class="remote-viewer"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class evince
    match class="evince"
    opacity 0.9
}
window-rule {
    // Hyprland: windowrule = opaque on, match:class Zotero
    match class="Zotero"
    opacity 0.9
}

// Picture-in-Picture
window-rule {
    // Hyprland: windowrule = float on, match:class firefox, match:title ^(Picture-in-Picture)$
    match class="firefox" title="^(Picture-in-Picture)$"
    open-floating true
}
window-rule {
    // Hyprland: windowrule = pin on, match:class firefox, match:title ^(Picture-in-Picture)$
    match class="firefox" title="^(Picture-in-Picture)$"
    pinned true
}

// Sharing Indicator
window-rule {
    // Hyprland: windowrule = float on,match:class ^(LibreWolf)$,match:title ^(LibreWolf — Sharing Indicator)$
    match class="LibreWolf" title="^(LibreWolf — Sharing Indicator)$"
    open-floating true
}
window-rule {
    // Hyprland: windowrule = no_focus on,match:class ^(LibreWolf)$,match:title ^(LibreWolf — Sharing Indicator)$
    match class="LibreWolf" title="^(LibreWolf — Sharing Indicator)$"
    open-focused false
}
window-rule {
    // Hyprland: windowrule = move 49% 30,match:class ^(LibreWolf)$,match:title ^(LibreWolf — Sharing Indicator)$
    match class="LibreWolf" title="^(LibreWolf — Sharing Indicator)$"
    default-floating-position x=49% y=30
}

// Do not blur floating xwayland (menus)
window-rule {
    // Hyprland: windowrule = no_blur on, match:xwayland 1, match:float 1
    match xwayland=true is-floating=true
    background-effect { blur false }
}
window-rule {
    // Hyprland: windowrule = opaque on, match:xwayland 1, match:float 1
    match xwayland=true is-floating=true
    opacity 0.9
}

// Smart gaps
window-rule {
    // Hyprland: workspace = w[tv1], gapsout:0, gapsin:0
    match is-floating=false workspace="w[tv1]"
    geometry-corner-radius 0
}
window-rule {
    match is-floating=false workspace="f[1]"
    geometry-corner-radius 0
}

window-rule {
    match is-floating=false workspace="w[tv1]"
    clip-to-geometry false
}
window-rule {
    match is-floating=false workspace="f[1]"
    clip-to-geometry false
}

// Dragon drop
window-rule {
    // Hyprland: windowrule = move cursor -50% -50%, match:class dragon-drop
    match class="dragon-drop"
    default-floating-position x=-50% y=-50%
}
window-rule {
    // Hyprland: windowrule = size 5% 1%, match:class dragon-drop
    match class="dragon-drop"
    default-column-width { proportion 0.05; }
    default-window-height { proportion 0.01; }
}

// Smart gaps (additional rule for workspace gaps)
window-rule {
    workspace "w[tv1]"
    gaps-out 0
    gaps-in 0
}
window-rule {
    workspace "f[1]"
    gaps-out 0
    gaps-in 0
}

// Layer rules
layer-rule {
    match namespace="selection"
    no-anim true
}

layer-rule {
    match namespace="waybar"
    background-effect { blur true }
}

layer-rule {
    match namespace="rofi"
    background-effect { blur true }
}

layer-rule {
    match namespace="notifications"
    background-effect { blur true }
}

// ============================================
// Animations
// ============================================
animations {
    enabled true

    // Slow down all animations by this factor. Values below 1 speed them up instead.
    // slowdown 3.0
}

// ============================================
// Keybindings
// ============================================
binds {
    // Show hotkey overlay
    Mod+Shift+Slash { show-hotkey-overlay; }

    // Volume keys (using pactl equivalent)
    XF86AudioRaiseVolume { spawn "pactl" "set-sink-volume" "@DEFAULT_SINK@" "+5%"; }
    XF86AudioLowerVolume { spawn "pactl" "set-sink-volume" "@DEFAULT_SINK@" "-5%"; }
    XF86AudioMute { spawn "pactl" "set-sink-mute" "@DEFAULT_SINK@" "toggle"; }
    XF86AudioMicMute { spawn "pactl" "set-source-mute" "@DEFAULT_SOURCE@" "toggle"; }

    // Media keys bindings
    XF86AudioPlay { spawn "playerctl" "play-pause"; }
    XF86AudioPause { spawn "playerctl" "-a" "pause"; }
    XF86AudioNext { spawn "playerctl" "next"; }
    XF86AudioPrev { spawn "playerctl" "previous"; }

    // Mod + arrow keys for media control
    Mod+Left { spawn "playerctl" "previous"; }
    Mod+Right { spawn "playerctl" "next"; }
    Mod+Down { spawn "playerctl" "-a" "pause"; }
    Mod+Up { spawn "playerctl" "play-pause"; }

    // Display key
    XF86Display { spawn "pkill wdisplays || wdisplays"; }

    // Use xbacklight to change backlight
    XF86MonBrightnessUp { spawn "xbacklight -set $(expr $(xbacklight -get) \* 3 \/ 2 + 1) -fps 60"; }
    XF86MonBrightnessDown { spawn "xbacklight -set $(expr $(xbacklight -get) \* 2 \/ 3) -fps 60"; }

    // Start a terminal
    Mod+Return { spawn "alacritty"; }

    // Kill focused window
    Mod+Q { close-window; }

    // Start dmenu (a program launcher)
    Mod+D { spawn "rofi" "-show" "combi" "-modi" "combi" "-combi-modes" "web:rofi-web-search,drun" "-theme" "spotlight-dark" "-combi-display-format" "{text}"; }

    // Change focus
    Mod+H { focus-column-left; }
    Mod+L { focus-column-right; }
    Mod+K { focus-window-up; }
    Mod+J { focus-window-down; }

    // Move focused window
    Mod+Shift+H { move-column-left; }
    Mod+Shift+L { move-column-right; }
    Mod+Shift+K { move-window-up; }
    Mod+Shift+J { move-window-down; }

    // Toggle group / change group active
    Mod+Shift+Z { consume-window-into-column; }
    Mod+Z { expel-window-from-column; }

    // Enter fullscreen mode
    Mod+F { maximize-column; }

    // Toggle tiling / floating
    Mod+Space { switch-preset-column-width; }

    // Exit
    Mod+Shift+E { quit; }

    // Web browser
    Mod+W { spawn "firefox"; }
    Mod+Ctrl+W { spawn "firefox" "-private-window"; }

    // Apps
    Mod+M { spawn "launch-focus-hyprland -x youtube-music -c "com.github.th_ch.youtube_music""; }
    Mod+Comma { spawn "launch-focus-hyprland -x signal-desktop -c signal"; }
    Mod+Period { spawn "launch-focus-hyprland -x ferdium -c ferdium"; }
    Mod+E { spawn "nautilus"; }
    Mod+N { spawn "thunderbird"; }

    // System
    Mod+Shift+P { spawn "systemctl suspend-then-hibernate"; }
    Mod+P { spawn "i3lock"; }

    // Focus urgent
    Mod+U { focus-urgent-or-last; }

    // Dunst notification
    Ctrl+Space { spawn "dunstctl close"; }

    // Screenshot
    Mod+S { spawn "grim -g \"$(slurp)\" - | wl-copy"; }
    Mod+Shift+S { spawn "GRIM_DEFAULT_DIR=~/Pictures/screenshots grim -g \"$(slurp)\""; }

    // Toggle opacity
    Mod+Shift+O { spawn "hyprctl setprop active opaque toggle"; }
